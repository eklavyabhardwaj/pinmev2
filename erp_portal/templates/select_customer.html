{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%25%22 stop-color=%22%230f766e%22/><stop offset=%22100%25%22 stop-color=%22%23374151%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22url(%23g)%22/><path d=%22M50,18 C38,18 28,28 28,40 C28,56 50,82 50,82 C50,82 72,56 72,40 C72,28 62,18 50,18 Z%22 fill=%22white%22/><circle cx=%2250%22 cy=%2239%22 r=%2210%22 fill=%22%230f766e%22/></svg>">
  <meta charset="UTF-8" />
  <title>PinMe - U&PO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="{% static 'pinme.css' %}">
  <style>
    /* helper styles for Assign-To rows + tiny status */
    .assign-row{display:flex;flex-direction:column}
    .assign-name{font-weight:600}
    .assign-email{font-size:.9em}
    .mini-status{font-size:.85em;color:#6b7280;margin-top:6px}

    /* ── Mobile overrides ── */

    /* Allow natural top-to-bottom scroll instead of centering */
    body {
      align-items: flex-start;
      padding: 0;
      min-height: 100dvh;
    }

    .punch-container {
      width: 100%;
      min-height: 100dvh;
      border-radius: 0;
      border: none;
      box-shadow: none;
      padding: 20px 16px;
      /* iPhone safe areas */
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(100px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }

    /* Page header row: title left, logout right */
    .page-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .page-header h1 {
      margin-bottom: 0;
      font-size: 22px;
      flex: 1;
    }
    .page-header h1::after { width: 32px; }

    /* Logout inside header on mobile */
    #logout-btn-mobile {
      flex-shrink: 0;
      font-size: 13px;
      padding: 8px 14px;
      height: auto;
    }

    /* Hide the absolute-positioned form on mobile */
    .top-right { display: none; }

    /* Comfortable tap targets */
    input[type="text"],
    input[type="password"],
    select, textarea {
      font-size: 16px !important; /* prevents iOS zoom */
      padding: 13px 14px;
      min-height: 48px;
    }

    .dropdown-list .dropdown-item {
      padding: 14px 16px;
      font-size: 15px;
    }

    /* Punch Out button — big and prominent */
    #btn-out {
      width: 100%;
      min-height: 54px;
      font-size: 17px;
      letter-spacing: .2px;
      border-radius: 14px;
      margin-top: 8px;
    }

    /* Update location button */
    #btn-update-location {
      width: 100%;
      min-height: 46px;
      font-size: 14px;
    }

    /* Status bar */
    #status { margin-top: 14px; font-size: 14px; }

    /* FAB safe area on iPhone */
    #wa-fab-wrap {
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      right: max(20px, env(safe-area-inset-right, 20px));
    }

    /* On larger phones/tablets restore card look */
    @media (min-width: 540px) {
      body { align-items: center; padding: clamp(16px, 4vw, 40px); }
      .punch-container {
        min-height: auto;
        width: min(600px, 100%);
        border-radius: 20px;
        border: 1px solid rgba(255,255,255,.9);
        box-shadow: 0 12px 40px rgba(15,23,42,.12), 0 4px 12px rgba(15,23,42,.06);
        padding: clamp(24px, 5vw, 44px);
      }
      .page-header { display: none; }
      #greeting-desktop { display: block !important; }
      .top-right { display: block; }
      h1 { font-size: clamp(22px, 3vw, 28px); margin-bottom: 20px; }
    }
  </style>
</head>
<body>
<div class="punch-container" role="main" aria-label="Select Customer and Punch Out">
  <!-- Mobile: title + logout in one row -->
  <div class="page-header">
    <h1 id="greeting">Select Customer &amp; Punch Out</h1>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger" id="logout-btn-mobile">Logout</button>
    </form>
  </div>
  <!-- Desktop heading (hidden on mobile via CSS) -->
  <h1 id="greeting-desktop" style="display:none">Select Customer &amp; Punch Out</h1>

  <div class="form-group" id="customerSearchBlock">
    <label for="customerInput">Customer</label>
    <div class="dropdown-wrap" id="customerDropdownWrap">
      <input type="text" id="customerInput" placeholder="Start typing to search..." autocomplete="off" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="dropdownList" />
      <div class="dropdown-arrow" aria-hidden="true"></div>
      <div class="dropdown-list" id="dropdownList" role="listbox" tabindex="-1"></div>
    </div>

    <button id="btn-update-location" type="button" disabled style="margin-top:10px;">
      Update Address through GPS
    </button>
  </div>

  <!-- Remark (visible when NO customer is selected) -->
  <div class="form-group" id="remarkFieldWrap" style="display:none;">
    <label for="freeRemark">Remark</label>
    <textarea id="freeRemark" rows="3" placeholder="Type your remark (e.g., new customer details, context)…"></textarea>
    <div class="muted" style="margin-top:4px">
      Visible only when no customer is selected. Will be saved in Employee Checkin.
    </div>
  </div>

  <!-- Assign To -->
  <div class="form-group" id="assignBlock">
    <label for="assignInput">Assign To <span class="muted">(optional)</span></label>
    <div class="dropdown-wrap" id="assignDropdownWrap">
      <input type="text" id="assignInput" placeholder="Search employee name or email..." autocomplete="off" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="assignDropdownList" />
      <div class="dropdown-arrow" aria-hidden="true"></div>
      <div class="dropdown-list" id="assignDropdownList" role="listbox" tabindex="-1"></div>
    </div>
    <div id="assignMiniStatus" class="mini-status"></div>
    <div class="muted" style="margin-top:4px">
      Select a person to assign this punch-out in ERP.
    </div>
  </div>

  <div class="buttons">
    <button id="btn-out" class="pulse" type="button">Punch Out</button>
  </div>

  <div class="status" id="status" role="alert" aria-live="assertive"></div>
  <div class="copyright">
    &copy; 2026 Electrolab India Pvt Ltd
  </div>
</div>

<form method="post" action="{% url 'logout' %}" class="top-right">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">
      Logout
  </button>
</form>

<script>
  // ===== Setup data =====
  const qs = new URLSearchParams(location.search);
  const urlCustomer = qs.get('customer') || qs.get('customer_name');

  const customers = [
    {% for c in customers %}
      { name: '{{ c.name|escapejs }}', display: '{{ c.customer_name|escapejs }}' },
    {% endfor %}
  ];

  // legacy fallback list (strings)
  const employeesEmails = [
    {% if employees_emails %}
      {% for e in employees_emails %}
        '{{ e|escapejs }}',
      {% endfor %}
    {% endif %}
  ];

  let selectedCustomer = null;

  // Assign-To chosen email
  let selectedAssignEmail = '';

  // ===== Greeting =====
  window.addEventListener('DOMContentLoaded', () => {
    const h = new Date().getHours();
    const greeting = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
    const text = `${greeting}, {{ employee_name|escapejs }}`;
    document.getElementById('greeting').textContent = text;
    const d = document.getElementById('greeting-desktop');
    if (d) d.textContent = text;
  });

  function findCustomerFromQuery(q) {
    if (!q) return null;
    q = decodeURIComponent(q).trim();
    let c = customers.find(x => x.name === q);
    if (c) return c;
    c = customers.find(x => x.display === q) ||
        customers.find(x => x.display.toLowerCase() === q.toLowerCase());
    if (c) return c;
    const lc = q.toLowerCase();
    return customers.find(x => x.display.toLowerCase().includes(lc)) || null;
  }

  function updateRemarkVisibility() {
    const wrap = document.getElementById('remarkFieldWrap');
    if (!wrap) return;
    wrap.style.display = selectedCustomer ? 'none' : 'block';
  }

  // ===== Preselect from query + init Assign-To =====
  window.addEventListener('DOMContentLoaded', () => {
    const inp = document.getElementById('customerInput');
    if (urlCustomer) {
      const found = findCustomerFromQuery(urlCustomer);
      if (found) {
        selectedCustomer = found.name;
        inp.value = found.display;
        inp.setAttribute('readonly', 'readonly');
        onCustomerChosen();
        updateRemarkVisibility();
      } else {
        console.warn('Customer from query not found in provided list:', urlCustomer);
        updateRemarkVisibility();
      }
    } else {
      updateRemarkVisibility();
    }
    initAssignTo(); // <— important
  });

  // ===== Customer dropdown =====
  (function() {
    const wrap = document.getElementById('customerDropdownWrap');
    const inp = document.getElementById('customerInput');
    const dd = document.getElementById('dropdownList');
    let filtered = customers;
    let highlighted = -1;

    function showList(arr) {
      dd.innerHTML = '';
      if (!arr.length) {
        const no = document.createElement('div');
        no.className = 'no-results';
        no.textContent = 'No customers found';
        dd.appendChild(no);
      } else {
        arr.forEach((c,i) => {
          const div = document.createElement('div');
          div.className = 'dropdown-item';
          div.textContent = c.display;
          div.setAttribute('role','option');
          if (i === highlighted) {
            div.classList.add('highlighted');
            div.setAttribute('aria-selected','true');
          } else {
            div.setAttribute('aria-selected','false');
          }
          div.addEventListener('click', () => selectCustomer(c));
          dd.appendChild(div);
        });
      }
      dd.classList.add('show');
      wrap.classList.add('dropdown-open');
      inp.setAttribute('aria-expanded', 'true');
    }

    function hideList() {
      dd.classList.remove('show');
      wrap.classList.remove('dropdown-open');
      highlighted = -1;
      inp.setAttribute('aria-expanded', 'false');
    }

    function selectCustomer(c) {
      selectedCustomer = c.name;
      inp.value = c.display;
      hideList();
      onCustomerChosen();
      updateRemarkVisibility();
    }

    inp.addEventListener('focus', () => showList(customers));
    inp.addEventListener('blur', () => setTimeout(hideList, 120));
    inp.addEventListener('input', e => {
      const q = e.target.value.toLowerCase();
      filtered = customers.filter(c => c.display.toLowerCase().includes(q));
      highlighted = -1;
      showList(filtered);
    });
    inp.addEventListener('keydown', e => {
      const items = [...dd.querySelectorAll('.dropdown-item')];
      if (['ArrowDown','ArrowUp'].includes(e.key)) {
        e.preventDefault();
        if (!items.length) return;
        highlighted = e.key === 'ArrowDown' ? Math.min(highlighted + 1, items.length - 1) : Math.max(highlighted - 1, 0);
        items.forEach((el, i) => {
          el.classList.toggle('highlighted', i === highlighted);
          el.setAttribute('aria-selected', i === highlighted ? 'true' : 'false');
        });
        items[highlighted]?.scrollIntoView({block:'nearest'});
      }
      if (e.key === 'Enter' && highlighted >= 0) items[highlighted].click();
      if (e.key === 'Escape') hideList();
    });
    document.addEventListener('mousedown', e => { if (!wrap.contains(e.target)) hideList(); });
  })();

  // ===== Geo =====
  async function getGeoSafe() {
    return new Promise(resolve => {
      if (!navigator.geolocation) return resolve({});
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude, city: '', state: '', area: '' }),
        _err => resolve({}),
        { maximumAge: 15000, timeout: 10000 }
      );
    });
  }

  // ===== Assign-To helpers =====
  function extractEmailFromDisplay(s) {
    if (!s) return '';
    const m = s.match(/<\s*([^>]+)\s*>/);
    if (m && m[1]) return m[1].trim();
    if (/\S+@\S+\.\S+/.test(s)) return s.trim();
    return '';
  }

  // ===== Punch Out =====
  async function doPunchOut() {
    updateStatus('Punching OUT...');

    // Ensure Assign-To is a valid person (if user typed and didn't click)
    if (typeof window.__resolveAssignEmailBeforeSubmit === 'function') {
      const ok = window.__resolveAssignEmailBeforeSubmit();
      if (!ok) return; // stop until user fixes Assign To
    }

    const geo = await getGeoSafe();

    const base = {
      log_type: 'OUT',
      time: new Date().toISOString(),
      device_id: navigator.userAgent,
      longitude: Number.isFinite(geo.longitude) ? geo.longitude : 0,
      latitude:  Number.isFinite(geo.latitude)  ? geo.latitude  : 0,
      city:  geo.city  || '',
      state: geo.state || '',
      area:  geo.area  || ''
    };

    const remarkFree = !selectedCustomer
      ? (document.getElementById('freeRemark')?.value || '').trim()
      : '';

    const assign_to_email = (selectedAssignEmail || '').trim();

    const payload = {
      ...base,
      customer: selectedCustomer || '',
      remark_free: remarkFree,
      assign_to_email,
    };

    try {
      const csrftoken = document.cookie.match(/(^|;)\s*csrftoken=([^;]+)/)?.pop();
      const res = await fetch("{% url 'punch' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
        body: JSON.stringify(payload)
      });
      const r = await res.json().catch(() => ({}));
      if (res.ok) {
        updateStatus('Punch OUT saved!');
        if (r.next_url) {
          window.location.href = r.next_url;
          return;
        }
      } else {
        updateStatus(r.detail || `Error during punch out. (${res.status})`, true);
      }
    } catch {
      updateStatus('Network error occurred. Please try again.', true);
    }
  }

  document.getElementById('btn-out').onclick = doPunchOut;

  // ===== Customer location update (unchanged) =====
  const btnUpdateLoc = document.getElementById('btn-update-location');

  function onCustomerChosen() {
    btnUpdateLoc.disabled = !selectedCustomer;
    updateRemarkVisibility();
  }

  async function getGPS() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error('Geolocation not supported'));
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
        err => reject(err),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
  }

  btnUpdateLoc.addEventListener('click', async () => {
    if (!selectedCustomer) {
      updateStatus('Please pick a customer first.', true);
      return;
    }
    updateStatus('Getting GPS…');
    try {
      const { lat, lon } = await getGPS();
      const csrftoken = document.cookie.match(/(^|;)\s*csrftoken=([^;]+)/)?.pop();
      const r = await fetch("{% url 'update_customer_location' %}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
        body: JSON.stringify({
          customer: selectedCustomer,
          latitude: lat,
          longitude: lon
        })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Update failed');
      updateStatus(j.message || 'Location submitted for admin approval.');
    } catch (e) {
      updateStatus(e.message || 'Failed to update location', true);
    }
  });

  function updateStatus(msg, isError = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status' + (isError ? ' error' : ' success');
  }

  // ===== Assign-To (robust fetch + UI) =====
  async function initAssignTo() {
    const wrap = document.getElementById('assignDropdownWrap');
    const inp  = document.getElementById('assignInput');
    const dd   = document.getElementById('assignDropdownList');
    const mini = document.getElementById('assignMiniStatus');

    let people = [];
    let loadedFrom = 'api';

    async function loadPeople() {
      // 1) Try API
      try {
        const r = await fetch("{% url 'get_employees' %}", {
          credentials: 'same-origin',
          headers: { 'Accept': 'application/json' }
        });
        const text = await r.text();
        let j;
        try {
          j = JSON.parse(text);
        } catch {
          console.warn('get_employees returned non-JSON:', text.slice(0, 200));
          j = null;
        }
        if (j && Array.isArray(j.employees) && j.employees.length) {
          return j.employees
            .filter(p => p && p.email && p.label)
            .map(p => ({ email: String(p.email).trim(), label: String(p.label).trim() }));
        }
        if (j && Array.isArray(j.emails) && j.emails.length) {
          // legacy shape
          return j.emails.filter(Boolean).map(e => ({ email: String(e), label: String(e) }));
        }
      } catch (e) {
        console.warn('get_employees error:', e);
      }
      // 2) Fallback to server-injected emails, if any
      loadedFrom = 'fallback';
      if (Array.isArray(employeesEmails) && employeesEmails.length) {
        return employeesEmails.filter(Boolean).map(e => ({ email: String(e), label: String(e) }));
      }
      return [];
    }

    people = await loadPeople();

    // update mini-status
    if (people.length) {
      mini.textContent = `Loaded ${people.length} people${loadedFrom==='fallback' ? ' (fallback)' : ''}.`;
    } else {
      mini.textContent = 'No employees loaded. You can still type, but suggestions are empty.';
    }

    let filtered = people.slice();
    let highlighted = -1;

    function renderItem(person, isHi) {
      const div = document.createElement('div');
      div.className = 'dropdown-item';
      div.innerHTML = `
        <div class="assign-row">
          <div class="assign-name">${person.label}</div>
          <div class="assign-email muted">${person.email}</div>
        </div>`;
      div.setAttribute('role', 'option');
      div.setAttribute('aria-selected', isHi ? 'true' : 'false');
      if (isHi) div.classList.add('highlighted');
      div.addEventListener('click', () => selectAssign(person));
      return div;
    }

    function showList(arr) {
      dd.innerHTML = '';
      if (!arr.length) {
        const no = document.createElement('div');
        no.className = 'no-results';
        no.textContent = 'No matches';
        dd.appendChild(no);
      } else {
        arr.forEach((p, i) => dd.appendChild(renderItem(p, i === highlighted)));
      }
      dd.classList.add('show');
      wrap.classList.add('dropdown-open');
      inp.setAttribute('aria-expanded', 'true');
    }

    function hideList() {
      dd.classList.remove('show');
      wrap.classList.remove('dropdown-open');
      highlighted = -1;
      inp.setAttribute('aria-expanded', 'false');
    }

    function selectAssign(person) {
      selectedAssignEmail = person.email;                   // used in payload
      inp.value = `${person.label} <${person.email}>`;      // friendly display
      hideList();
    }

    // When leaving the field without clicking, try to resolve typed value to a known email.
    window.__resolveAssignEmailBeforeSubmit = function() {
      if (selectedAssignEmail) return true; // already chosen
      const typed = extractEmailFromDisplay(inp.value);
      if (!typed) return true; // optional field, nothing typed
      const match = people.find(p => (p.email || '').toLowerCase() === typed.toLowerCase());
      if (match) {
        selectedAssignEmail = match.email;
        inp.value = `${match.label} <${match.email}>`;
        return true;
      }
      updateStatus('Please pick a valid person from suggestions for "Assign To".', true);
      setTimeout(() => updateStatus('', false), 3000);
      return false;
    };

    // Open immediately so you can see suggestions
    inp.addEventListener('focus', () => showList(filtered));
    inp.addEventListener('blur',  () => {
      setTimeout(hideList, 120);
      // try to resolve on blur too (non-blocking here)
      const typed = extractEmailFromDisplay(inp.value);
      if (typed && !selectedAssignEmail) {
        const match = people.find(p => (p.email || '').toLowerCase() === typed.toLowerCase());
        if (match) {
          selectedAssignEmail = match.email;
          inp.value = `${match.label} <${match.email}>`;
        }
      }
    });
    inp.addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      filtered = people.filter(p =>
        (p.label || '').toLowerCase().includes(q) ||
        (p.email || '').toLowerCase().includes(q)
      );
      highlighted = -1;
      showList(filtered);
    });
    inp.addEventListener('keydown', e => {
      const items = [...dd.querySelectorAll('.dropdown-item')];
      if (['ArrowDown','ArrowUp'].includes(e.key)) {
        e.preventDefault();
        if (!items.length) return;
        highlighted = e.key === 'ArrowDown'
          ? Math.min(highlighted + 1, items.length - 1)
          : Math.max(highlighted - 1, 0);
        items.forEach((el, i) => {
          el.classList.toggle('highlighted', i === highlighted);
          el.setAttribute('aria-selected', i === highlighted ? 'true' : 'false');
        });
        items[highlighted]?.scrollIntoView({block:'nearest'});
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (highlighted >= 0 && filtered[highlighted]) {
          selectAssign(filtered[highlighted]);
        } else {
          // No item highlighted -> accept typed value if it matches a known email
          const typed = extractEmailFromDisplay(inp.value);
          if (typed) {
            const match = people.find(p => (p.email || '').toLowerCase() === typed.toLowerCase());
            if (match) selectAssign(match);
          }
          hideList();
        }
      } else if (e.key === 'Escape') {
        hideList();
      }
    });
    document.addEventListener('mousedown', e => { if (!wrap.contains(e.target)) hideList(); });
  }
</script>
<!-- WhatsApp Bot FAB -->
<div id="wa-fab-wrap">
  <!-- Speech bubble -->
  <div id="wa-bubble">
    <span id="wa-bubble-text">Talk to Bot</span>
    <button id="wa-bubble-close" aria-label="Dismiss">×</button>
    <div id="wa-bubble-tail"></div>
  </div>

<style>
  #wa-fab-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    z-index: 9999;
  }

  /* Speech bubble */
  #wa-bubble {
    position: relative;
    background: #fff;
    border-radius: 14px 14px 4px 14px;
    padding: 10px 32px 10px 14px;
    box-shadow: 0 4px 18px rgba(0,0,0,.14);
    display: flex;
    align-items: center;
    gap: 8px;
    animation: wa-bubble-in .35s cubic-bezier(.34,1.56,.64,1) both;
    border: 1px solid rgba(37,211,102,.25);
  }
  #wa-bubble-text {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #111;
    white-space: nowrap;
  }
  /* Robot emoji graphic */
  #wa-bubble-text::before {
    content: '🤖 ';
  }
  #wa-bubble-close {
    position: absolute;
    top: 4px;
    right: 7px;
    background: none;
    border: none;
    font-size: 15px;
    line-height: 1;
    color: #94a3b8;
    cursor: pointer;
    padding: 0;
    width: auto;
    height: auto;
    box-shadow: none;
    min-width: 0;
    transform: none;
  }
  #wa-bubble-close:hover { color: #475569; transform: none; box-shadow: none; }
  /* Tail pointing down-right toward FAB */
  #wa-bubble-tail {
    position: absolute;
    bottom: -8px;
    right: 18px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 0px solid transparent;
    border-top: 9px solid #fff;
    filter: drop-shadow(0 2px 1px rgba(0,0,0,.06));
  }

  #wa-bubble.hidden { display: none; }

  @keyframes wa-bubble-in {
    from { opacity: 0; transform: scale(.8) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* FAB button */
  #wa-fab {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #25d366;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 16px rgba(37,211,102,.45), 0 2px 6px rgba(0,0,0,.18);
    transition: transform .15s ease, box-shadow .2s ease;
    text-decoration: none;
    position: relative;
  }
  #wa-fab:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 24px rgba(37,211,102,.55), 0 3px 8px rgba(0,0,0,.2);
  }
  #wa-fab:active { transform: scale(.96); }
  #wa-fab::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    animation: wa-pulse 2.5s ease-out infinite;
  }
  @keyframes wa-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(37,211,102,.45); }
    70%  { box-shadow: 0 0 0 12px rgba(37,211,102,0); }
    100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
  }
</style>
<script>
  document.getElementById('wa-bubble-close').addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    document.getElementById('wa-bubble').classList.add('hidden');
  });
</script>
