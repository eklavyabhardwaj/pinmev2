{% load static %}
<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><defs><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%25%22 stop-color=%22%230f766e%22/><stop offset=%22100%25%22 stop-color=%22%23374151%22/></linearGradient></defs><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22url(%23g)%22/><path d=%22M50,18 C38,18 28,28 28,40 C28,56 50,82 50,82 C50,82 72,56 72,40 C72,28 62,18 50,18 Z%22 fill=%22white%22/><circle cx=%2250%22 cy=%2239%22 r=%2210%22 fill=%22%230f766e%22/></svg>">
  <title>PinMe - Punch In</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <link rel="stylesheet" href="{% static 'pinme.css' %}">
</head>
<body>
  <div class="punch-container">
    <h1 id="greeting">Good Day {{ employee_name }}</h1>
    <p class="sub" id="listSubtitle">Customers within 5 km of your current location</p>
    <iframe id="map" src="https://maps.google.com/maps?q=20.5937,78.9629&z=5&output=embed" loading="lazy" allowfullscreen></iframe>
    <div class="toolbar">
      <div class="search" style="position:relative;flex:1;">
        <div class="dropdown-wrap" id="searchDropdownWrap">
          <input id="searchBox" type="text" placeholder="Search customer in list…" autocomplete="off" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="searchDropdownList">
          <div class="dropdown-arrow" aria-hidden="true"></div>
          <div class="dropdown-list" id="searchDropdownList" role="listbox" tabindex="-1"></div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <button id="btn-in-generic" class="btn" title="Punch in without selecting a listed customer">
        Punch In (New Customer)
      </button>

          <form action="{% url 'energy_points' %}" method="get" style="display:inline;">
  <button type="submit" class="btn btn-secondary">Energy Points</button>
</form>

    </div>



    <ul id="custList" class="list"></ul>
    <div id="status" class="status"></div>

    <div class="copyright" class="copyright">
      &copy; 2026 Electrolab India Pvt Ltd. All rights reserved.
    </div>
  </div>

  <form method="post" action="{% url 'logout' %}" class="top-right">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
      Logout
    </button>
  </form>


  <script>
    const statusEl   = document.getElementById('status');
    const listEl     = document.getElementById('custList');
    const searchBox  = document.getElementById('searchBox');
    const btnNoCust  = document.getElementById('btn-in-generic');

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, ch => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[ch]));
    }

    function setGreeting() {
      const h = new Date().getHours();
      const g = h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
      document.getElementById('greeting').textContent = `${g} {{ employee_name }}`;
    }
    function setStatus(msg, type='') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (type || '');
    }

    async function fetchNearby(lat, lon) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), 15000);
      try {
        const url = `{% url 'nearby_customers' %}?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`;
        const r = await fetch(url, { signal: controller.signal });
        if (!r.ok) throw new Error(await r.text());
        return await r.json();
      } finally {
        clearTimeout(t);
      }
    }

    // nearbyCustomers holds the full nearby list for when search is cleared
    let nearbyCustomers = [];

    // Full-name toast
    function showFullName(name) {
      const t = document.getElementById('name-toast');
      t.textContent = name;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }

    function renderList(customers, emptyMsg = 'No customers found within 5 km.') {
      listEl.innerHTML = '';
      if (!customers.length) {
        listEl.innerHTML = `<li class="muted" style="text-align:center;padding:8px">${escapeHtml(emptyMsg)}</li>`;
        return;
      }
      customers.forEach(c => {
        const li = document.createElement('li');
        li.className = 'card';

        const info = document.createElement('div');
        info.className = 'info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'title name-tap';
        nameSpan.textContent = c.customer_name || '';
        nameSpan.title = c.customer_name || '';
        nameSpan.addEventListener('click', () => showFullName(c.customer_name || ''));

        const distLine = document.createElement('span');
        distLine.className = 'muted';
        distLine.textContent = c.distance_km != null ? `${c.distance_km} km away` : '';

        info.appendChild(nameSpan);
        if (c.distance_km != null) info.appendChild(distLine);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const hasLocation = c.has_location !== false && c.latitude != null && c.longitude != null;
        if (hasLocation) {
          const dir = document.createElement('a');
          dir.href = `https://www.google.com/maps/dir/?api=1&destination=${c.latitude},${c.longitude}`;
          dir.target = '_blank';
          dir.rel = 'noopener';
          dir.className = 'btn link';
          dir.textContent = 'Directions';
          dir.addEventListener('click', e => e.stopPropagation());
          actions.appendChild(dir);
        }

        const punch = document.createElement('button');
        punch.className = 'btn';
        punch.textContent = 'Punch In';
        punch.onclick = (e) => { e.stopPropagation(); doPunchIn(c.name, punch); };
        actions.appendChild(punch);

        li.appendChild(info);
        li.appendChild(actions);
        listEl.appendChild(li);
      });
    }

    // ── Search dropdown autocomplete ──
    (function() {
      const wrap = document.getElementById('searchDropdownWrap');
      const inp  = document.getElementById('searchBox');
      const dd   = document.getElementById('searchDropdownList');
      const subtitle = document.getElementById('listSubtitle');
      let searchTimer = null;
      let highlighted = -1;
      let lastResults = [];

      function showDD(results) {
        dd.innerHTML = '';
        highlighted = -1;
        if (!results.length) {
          const no = document.createElement('div');
          no.className = 'no-results';
          no.textContent = 'No customers found';
          dd.appendChild(no);
        } else {
          results.forEach((c, i) => {
            const div = document.createElement('div');
            div.className = 'dropdown-item';
            div.setAttribute('role', 'option');
            div.setAttribute('aria-selected', 'false');
            div.innerHTML = `
              <div style="font-weight:600;font-size:14px">${escapeHtml(c.customer_name || '')}</div>
              ${c.territory ? `<div class="muted" style="font-size:12px">${escapeHtml(c.territory)}</div>` : ''}`;
            div.addEventListener('click', () => pickSuggestion(c));
            dd.appendChild(div);
          });
        }
        dd.classList.add('show');
        wrap.classList.add('dropdown-open');
        inp.setAttribute('aria-expanded', 'true');
      }

      function hideDD() {
        dd.classList.remove('show');
        wrap.classList.remove('dropdown-open');
        highlighted = -1;
        inp.setAttribute('aria-expanded', 'false');
      }

      function pickSuggestion(c) {
        inp.value = c.customer_name || '';
        hideDD();
        subtitle.textContent = `Results for "${c.customer_name}"`;
        renderList([c], 'No customers found.');
        setStatus('');
      }

      inp.addEventListener('input', e => {
        const q = e.target.value.trim();
        clearTimeout(searchTimer);
        if (!q) {
          hideDD();
          subtitle.textContent = 'Customers within 5 km of your current location';
          renderList(nearbyCustomers);
          return;
        }
        searchTimer = setTimeout(async () => {
          try {
            setStatus('Searching…', 'loading');
            const r = await fetch(`{% url 'search_customers' %}?q=${encodeURIComponent(q)}`);
            if (!r.ok) throw new Error();
            const data = await r.json();
            lastResults = data.customers || [];
            showDD(lastResults);
            subtitle.textContent = `Search results for "${q}"`;
            renderList(lastResults, 'No customers found.');
            setStatus('');
          } catch {
            setStatus('Search failed', 'error');
          }
        }, 300);
      });

      inp.addEventListener('keydown', e => {
        const items = [...dd.querySelectorAll('.dropdown-item')];
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          highlighted = Math.min(highlighted + 1, items.length - 1);
          items.forEach((el, i) => el.classList.toggle('highlighted', i === highlighted));
          items[highlighted]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          highlighted = Math.max(highlighted - 1, 0);
          items.forEach((el, i) => el.classList.toggle('highlighted', i === highlighted));
          items[highlighted]?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter' && highlighted >= 0) {
          if (lastResults[highlighted]) pickSuggestion(lastResults[highlighted]);
        } else if (e.key === 'Escape') {
          hideDD();
        }
      });

      inp.addEventListener('blur', () => setTimeout(hideDD, 150));
      document.addEventListener('mousedown', e => { if (!wrap.contains(e.target)) hideDD(); });
    })();

    async function doPunchIn(customerName /* optional */, triggerBtn /* optional */) {
      setStatus('Punching IN…', 'loading');
      btnNoCust.disabled = true;
      if (triggerBtn) triggerBtn.disabled = true;

      if (!navigator.geolocation) {
        setStatus('Geolocation not supported', 'error');
        btnNoCust.disabled = false;
        if (triggerBtn) triggerBtn.disabled = false;
        return;
      }

      navigator.geolocation.getCurrentPosition(async pos => {
        const latitude = pos.coords.latitude;
        const longitude = pos.coords.longitude;

        // Update mini-map to current location
        const map = document.getElementById('map');
        map.src = `https://maps.google.com/maps?q=${latitude},${longitude}&z=16&output=embed`;

        const payload = {
          log_type: 'IN',
          time: new Date().toISOString(),
          device_id: navigator.userAgent,
          longitude, latitude,
          city: '', state: '', area: '',
          customer: customerName || ''
        };

        try {
          const csrftoken = document.cookie.match(/(^|;)\s*csrftoken=([^;]+)/)?.pop();
          const res = await fetch("{% url 'punch' %}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrftoken },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (res.ok) {
            setStatus('Punch IN recorded successfully', 'success');

            if (result.next_url) {
              // SAFE: set/replace ?customer using URL API
              const u = new URL(result.next_url, location.origin);
              if (customerName) u.searchParams.set('customer', customerName);
              window.location.href = u.toString();
              return;
            }
          } else {
            setStatus(`Error: ${result.detail || res.status}`, 'error');
          }
        } catch {
          setStatus('Network error occurred', 'error');
        } finally {
          btnNoCust.disabled = false;
          if (triggerBtn) triggerBtn.disabled = false;
        }
      }, err => {
        setStatus('Geolocation error: ' + err.message, 'error');
        btnNoCust.disabled = false;
        if (triggerBtn) triggerBtn.disabled = false;
      }, { maximumAge: 15000, timeout: 10000 });
    }

    // Page init
    window.addEventListener('DOMContentLoaded', async () => {
      setGreeting();

      if (!navigator.geolocation) {
        setStatus('Geolocation not supported', 'error');
        return;
      }

      setStatus('Loading your location…', 'loading');
      navigator.geolocation.getCurrentPosition(async pos => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        document.getElementById('map').src = `https://maps.google.com/maps?q=${lat},${lon}&z=14&output=embed`;
        try {
          setStatus('Finding nearby customers…', 'loading');
          const data = await fetchNearby(lat, lon);
          nearbyCustomers = data.customers || [];
          renderList(nearbyCustomers);
          setStatus('Nearby customers loaded.');
        } catch (e) {
          setStatus('Failed to load customers', 'error');
        }
      }, err => setStatus('Unable to retrieve location: ' + err.message, 'error'),
         { maximumAge: 30000, timeout: 12000 });
    });

    // UI events
    document.getElementById('btn-in-generic').addEventListener('click', () => doPunchIn(null, btnNoCust));
  </script>

<!-- Full-name toast -->
<div id="name-toast"></div>
<style>
  .name-tap { cursor: pointer; text-decoration: underline dotted #94a3b8; }
  .name-tap:active { opacity: .7; }
  #name-toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: rgba(15,23,42,.88);
    color: #fff;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: opacity .22s, transform .22s;
    pointer-events: none;
    max-width: 82vw;
    text-align: center;
    z-index: 8000;
    white-space: normal;
    word-break: break-word;
  }
  #name-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>

<!-- Greeting splash (shown once after login) -->
<div id="greeting-splash" style="display:none">
  <div id="gs-graphic"></div>
  <div id="gs-greeting"></div>
  <div id="gs-sub">Welcome back to PinMe</div>
</div>
<style>
  #greeting-splash {
    position: fixed; inset: 0; z-index: 10000;
    background: linear-gradient(135deg, #f0f4ff 0%, #f8faff 45%, #fff0fa 100%);
    background-size: 200% 200%;
    animation: gs-bg 4s ease infinite;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px; padding: 32px; text-align: center;
  }
  @keyframes gs-bg {
    0%,100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }
  #gs-graphic {
    font-size: 90px; line-height: 1;
    animation: gs-float 3s ease-in-out infinite, gs-in .5s ease-out both;
    filter: drop-shadow(0 4px 16px rgba(37,99,235,.15));
  }
  #gs-greeting {
    font-family: 'Inter', sans-serif;
    font-size: clamp(28px, 7vw, 48px);
    font-weight: 800; color: #0f172a;
    letter-spacing: -.5px; line-height: 1.2;
    animation: gs-in .5s .1s ease-out both;
  }
  #gs-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(14px, 3.5vw, 17px);
    color: #64748b;
    animation: gs-in .5s .2s ease-out both;
  }
  @keyframes gs-float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes gs-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #greeting-splash.gs-exit {
    animation: gs-exit .45s ease-in forwards;
  }
  @keyframes gs-exit {
    to { opacity: 0; transform: scale(1.04); }
  }
</style>
<script>
  if (sessionStorage.getItem('pinme_show_greeting')) {
    sessionStorage.removeItem('pinme_show_greeting');
    const h = new Date().getHours();
    let gr, ic;
    if (h < 12)      { gr = 'Good Morning';   ic = '🌤️'; }
    else if (h < 17) { gr = 'Good Afternoon';  ic = '☀️'; }
    else if (h < 20) { gr = 'Good Evening';    ic = '🌇'; }
    else             { gr = 'Good Night';       ic = '🌙'; }

    const splash = document.getElementById('greeting-splash');
    document.getElementById('gs-graphic').textContent  = ic;
    document.getElementById('gs-greeting').textContent = gr;
    splash.style.display = 'flex';

    setTimeout(() => {
      splash.classList.add('gs-exit');
      splash.addEventListener('animationend', () => splash.style.display = 'none', { once: true });
    }, 2200);
  }
</script>
